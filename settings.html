<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Settings - Design System 2026</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <h1>Architecture 2026 Config</h1>
    
    <div class="field">
      <label>Google Gemini API Key</label>
      <input type="password" id="geminiKey" placeholder="Enter Gemini API Key">
      <button id="testGemini" class="test-btn">Test Gemini</button>
    </div>

    <div class="field">
      <label>Notion API Token</label>
      <input type="password" id="notionToken" placeholder="secret_...">
    </div>

    <div class="field">
      <label>Notion Database ID (Design System 2026)</label>
      <input type="text" id="notionDbId" placeholder="32-char Database ID">
    </div>

    <div class="field">
      <label>Notion Parent Page ID (Generated Pages)</label>
      <input type="text" id="notionParentPageId" placeholder="32-char Page ID">
      <button id="testNotion" class="test-btn">Test Notion Connections</button>
    </div>

    <div class="footer-actions">
      <span id="saveStatus"></span>
      <button id="saveBtn" class="primary">Save Configuration</button>
    </div>

    <section class="help">
      <h3>Setup Guide</h3>
      <ol>
        <li>API Version: <code>2025-09-03</code></li>
        <li>Database Properties: Title, URL, Markdown, Summary, Created.</li>
        <li>Parent Page: A normal page to hold generated entries.</li>
        <li>Simulation: <button id="runSimulation" class="test-btn">Run Test Simulation</button></li>
      </ol>
    </section>
  </div>
  <script src="settings.js"></script>
</body>
</html>
